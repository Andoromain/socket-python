name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    name: Tests (${{ matrix.os }}, Python ${{ matrix.python }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python: ["3.12", "3.13"]
    env:
      QT_QPA_PLATFORM: offscreen
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
          cache: pip
      - name: Bibliothèques système Qt
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libegl1 libxkbcommon0 libfontconfig1 libdbus-1-3
      - run: pip install -e ".[dev]"
      - run: ruff check .
      - run: ruff format --check .
      - run: pytest

  android:
    name: Android (Flutter, interopérabilité, APK de test)
    runs-on: ubuntu-latest
    env:
      QT_QPA_PLATFORM: offscreen
      # Le test d'interopérabilité PC ↔ Android doit s'exécuter ici (pas d'« ignoré »).
      SOCKET_CHAT_REQUIRE_INTEROP: "1"
    defaults:
      run:
        working-directory: mobile
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: "3.47.9"
          cache: true
      - run: flutter pub get
      - run: dart format --set-exit-if-changed .
      - run: flutter analyze
      - run: flutter test
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Bibliothèques système Qt
        run: sudo apt-get update && sudo apt-get install -y libegl1 libxkbcommon0 libfontconfig1 libdbus-1-3
      - name: Interopérabilité avec la version PC
        working-directory: .
        run: |
          pip install -e ".[dev]"
          pytest -v tests/test_interop.py tests/test_protocol_vectors.py
      - name: APK de test
        run: |
          flutter build apk --release
          version=$(sed -n 's/^version: *\([0-9.]*\)+.*/\1/p' pubspec.yaml)
          mkdir -p dist
          cp build/app/outputs/flutter-apk/app-release.apk "dist/socket-chat-$version-android-test.apk"
      - uses: actions/upload-artifact@v4
        with:
          name: socket-chat-android-test
          path: mobile/dist/*.apk
          if-no-files-found: error
