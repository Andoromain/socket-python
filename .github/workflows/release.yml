name: Release

# Construit l'installeur Windows, l'archive Linux et l'APK Android signé, puis le
# manifeste de mise à jour (latest.json) signé (latest.json.sig).
# - Pull request touchant au packaging : construction et vérification seulement.
# - Lancement manuel : fichiers disponibles dans l'onglet « Artifacts » de l'exécution.
# - Tag vX.Y.Z : Release dans ce dépôt (public), consultée par la mise à jour automatique.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:
  pull_request:
    paths:
      - "packaging/**"
      - "scripts/**"
      - ".github/workflows/release.yml"
      - "src/socket_chat/updater.py"
      - "mobile/android/**"

# Lecture seule par défaut : seul le job « publish » peut écrire (création de la Release).
permissions:
  contents: read

jobs:
  check:
    name: Vérification du tag
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      # Échoue en quelques secondes (avant les constructions) si le tag ne désigne pas
      # la version du code : sinon les postes verraient une mise à jour en boucle.
      - name: Tag conforme à la version du code
        if: startsWith(github.ref, 'refs/tags/v')
        run: python scripts/make_latest.py --check-tag "${{ github.ref_name }}"

  build:
    name: Build ${{ matrix.os }}
    needs: check
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        # Ubuntu 22.04 : glibc plus ancienne => binaire compatible avec davantage de distributions.
        os: [windows-latest, ubuntu-22.04]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Bibliothèques système Qt
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libegl1 libxkbcommon0 libfontconfig1 libdbus-1-3
      - name: Inno Setup
        if: runner.os == 'Windows'
        run: choco install innosetup -y --no-progress
      - run: pip install ".[build]"
      - run: python scripts/build.py
      - uses: actions/upload-artifact@v4
        with:
          name: socket-chat-${{ runner.os }}
          path: |
            dist/*.exe
            dist/*.tar.gz
          if-no-files-found: error

  android:
    name: Build Android (APK signé)
    needs: check
    runs-on: ubuntu-latest
    env:
      IS_TAG: ${{ startsWith(github.ref, 'refs/tags/v') }}
      ANDROID_KEYSTORE: ${{ secrets.ANDROID_KEYSTORE }}
      ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
      ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
      ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
    defaults:
      run:
        working-directory: mobile
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: "3.47.9"
          cache: true
      # Android n'installe une mise à jour que si elle est signée avec la même clé : un APK
      # publié doit TOUJOURS être signé avec la clé définitive (secrets ANDROID_*).
      - name: Clé de signature
        run: |
          if [ -z "$ANDROID_KEYSTORE" ]; then
            if [ "$IS_TAG" = "true" ]; then
              echo "::error title=Clé Android absente::Secret ANDROID_KEYSTORE introuvable : l'APK ne peut pas être publié. Ajoutez les 4 secrets ANDROID_* (README, « Publier une version »), puis « Re-run failed jobs »."
              exit 1
            fi
            echo "::warning title=APK d'essai::Secrets ANDROID_* absents : APK signé avec la clé de débogage (essai seulement)."
            exit 0
          fi
          keystore="$RUNNER_TEMP/release.jks"
          printf '%s' "$ANDROID_KEYSTORE" | tr -d ' \r\n' | base64 -d > "$keystore"
          if ! keytool -list -v -keystore "$keystore" -storepass "$ANDROID_KEYSTORE_PASSWORD" \
              -alias "$ANDROID_KEY_ALIAS" > "$RUNNER_TEMP/key.txt" 2>&1; then
            echo "::error title=Clé Android illisible::Le secret ANDROID_KEYSTORE, ANDROID_KEYSTORE_PASSWORD ou ANDROID_KEY_ALIAS est incorrect (copie incomplète ?). Recopiez-les depuis le fichier de la clé."
            exit 1
          fi
          grep -m1 "SHA256:" "$RUNNER_TEMP/key.txt"
          echo "ANDROID_KEYSTORE_PATH=$keystore" >> "$GITHUB_ENV"
      - name: Version
        run: |
          version=$(sed -n 's/^version: *\([0-9.]*\)+.*/\1/p' pubspec.yaml)
          if [ "$IS_TAG" = "true" ] && [ "v$version" != "${{ github.ref_name }}" ]; then
            echo "::error title=Version Android incohérente::mobile/pubspec.yaml indique $version, le tag est ${{ github.ref_name }}."
            exit 1
          fi
          echo "VERSION=$version" >> "$GITHUB_ENV"
      - run: flutter pub get
      - run: flutter build apk --release
      - name: Vérification de la signature
        run: |
          apk=build/app/outputs/flutter-apk/app-release.apk
          apksigner="$(ls -d "$ANDROID_HOME"/build-tools/*/ | sort -V | tail -1)apksigner"
          certs=$("$apksigner" verify --print-certs "$apk")
          echo "$certs"
          if echo "$certs" | grep -q "CN=Android Debug" && [ "$IS_TAG" = "true" ]; then
            echo "::error title=APK mal signé::L'APK est signé avec la clé de débogage : publication refusée."
            exit 1
          fi
          mkdir -p ../dist
          cp "$apk" "../dist/socket-chat-$VERSION-android.apk"
      - uses: actions/upload-artifact@v4
        with:
          name: socket-chat-Android
          path: dist/*.apk
          if-no-files-found: error

  manifest:
    name: Manifeste de mise à jour
    needs: [build, android]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/download-artifact@v4
        with:
          path: dist
          pattern: socket-chat-*
          merge-multiple: true
      - name: latest.json
        env:
          TAG: ${{ startsWith(github.ref, 'refs/tags/v') && github.ref_name || '' }}
        run: |
          python scripts/make_latest.py --dist dist ${TAG:+--tag "$TAG"}
          cat dist/latest.json
          python -c "import json; print(json.load(open('dist/latest.json', encoding='utf-8'))['notes'])" > notes.md
      # Sans signature valide, les postes refusent la mise à jour : un tag l'exige.
      - name: Signature de latest.json
        env:
          UPDATE_SIGNING_KEY: ${{ secrets.UPDATE_SIGNING_KEY }}
          IS_TAG: ${{ startsWith(github.ref, 'refs/tags/v') }}
        run: |
          if [ -z "$UPDATE_SIGNING_KEY" ]; then
            if [ "$IS_TAG" = "true" ]; then
              echo "::error title=Clé de signature absente::Secret UPDATE_SIGNING_KEY introuvable : les postes refuseraient cette mise à jour. Ajoutez-le (README, « Publier une version »), puis « Re-run failed jobs »."
              exit 1
            fi
            echo "::warning title=Manifeste non signé::Secret UPDATE_SIGNING_KEY absent : latest.json n'est pas signé (essai seulement)."
            exit 0
          fi
          pip install "cryptography>=42"
          python scripts/sign_manifest.py dist/latest.json
      - uses: actions/upload-artifact@v4
        with:
          name: release-files
          path: |
            dist/*
            notes.md

  publish:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: manifest
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: release-files
          path: release
      # Les postes lisent releases/latest/download/latest.json de ce dépôt.
      - name: Release (mise à jour automatique)
        uses: softprops/action-gh-release@v2
        with:
          name: Socket Chat ${{ github.ref_name }}
          body_path: release/notes.md
          files: release/dist/*
          make_latest: true
