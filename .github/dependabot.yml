# Mises à jour de sécurité des dépendances (PR automatiques, une fois par semaine).
version: 2
updates:
  - package-ecosystem: pip
    directory: /
    schedule:
      interval: weekly
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
  - package-ecosystem: pub
    directory: /mobile
    schedule:
      interval: weekly
